<title>Carnet de route</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : une colonne-itinéraire, ligne de route verticale ; étapes = cartes, trajets = billets compacts entre elles */
:root {
  --bg: #eef3f1;
  --surface: #ffffff;
  --ink: #12302b;
  --muted: #5d716c;
  --line: #d3dfdb;
  --route: #e8a800;
  --accent: #0f6b5c;
  --accent-ink: #ffffff;
  --ticket: #fdf6e1;
  --danger: #b3261e;
  --focus: #0f6b5c;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1917; --surface: #15231f; --ink: #e3eeea; --muted: #94a9a3; --line: #2a3d38;
    --route: #f2bf2e; --accent: #4cc3a9; --accent-ink: #062a23; --ticket: #2a2617; --danger: #ff8a80; --focus: #4cc3a9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1917; --surface: #15231f; --ink: #e3eeea; --muted: #94a9a3; --line: #2a3d38;
  --route: #f2bf2e; --accent: #4cc3a9; --accent-ink: #062a23; --ticket: #2a2617; --danger: #ff8a80; --focus: #4cc3a9;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.15; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Barre du haut */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: auto; }
.trip-select { max-width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 500; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 8px; }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 4px 9px; font-size: 13px; }

/* En-tête du voyage */
.hero { display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font-size: clamp(28px, 6vw, 42px); font-weight: 700; }
.hero h1 input { font: inherit; border: 0; background: transparent; width: 100%; padding: 0; border-bottom: 2px dashed transparent; }
.hero h1 input:hover, .hero h1 input:focus { border-bottom-color: var(--line); outline: none; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); }
.hero-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* Itinéraire */
.route { position: relative; display: flex; flex-direction: column; padding-left: 34px; }
.route::before { content: ""; position: absolute; left: 11px; top: 14px; bottom: 14px; width: 3px; background: repeating-linear-gradient(var(--route) 0 10px, transparent 10px 16px); border-radius: 2px; }
.item { position: relative; }
.stop { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.stop::before { content: ""; position: absolute; left: -31px; top: 18px; width: 17px; height: 17px; border-radius: 50%; background: var(--surface); border: 4px solid var(--route); }
.stop-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.stop-head h2 { font-size: 22px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.day { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--accent); }
.dates { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nights { display: inline-block; font-family: var(--mono); font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--bg); color: var(--ink); }
.links { display: flex; flex-direction: column; gap: 6px; }
.link { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink); min-width: 0; }
.link:hover { border-color: var(--accent); }
.link .src { font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); flex: none; min-width: 64px; }
.link .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link .go { margin-left: auto; color: var(--muted); flex: none; }
.addr { font-size: 14px; color: var(--muted); }
.addr a { color: inherit; }
.notes { font-size: 14px; white-space: pre-wrap; color: var(--ink); overflow-wrap: anywhere; }
.row-actions { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }

/* Trajet = billet */
.transport { margin: 10px 0; background: var(--ticket); border: 1px dashed var(--route); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: start; }
.transport::before { content: ""; position: absolute; left: -27px; top: 50%; width: 9px; height: 9px; transform: translateY(-50%) rotate(45deg); background: var(--route); }
.mode { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: var(--bg); padding: 3px 8px; border-radius: 4px; }
.leg { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.leg-places { font-weight: 600; overflow-wrap: anywhere; }
.leg-times { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--muted); }
.leg-times b { color: var(--ink); font-weight: 600; }
.dur { color: var(--ink); font-weight: 600; }
.leg-extra { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.leg-extra a { color: var(--accent); }
.transport .row-actions { grid-column: 1 / -1; }

/* Insertion */
.insert { display: flex; gap: 6px; padding: 6px 0; opacity: .55; transition: opacity .15s; }
.insert:hover, .insert:focus-within { opacity: 1; }
.insert .btn { font-size: 12px; padding: 3px 9px; border-style: dashed; background: transparent; }
@media (hover: none) { .insert { opacity: 1; } }

/* Formulaires */
.form { background: var(--surface); border: 2px solid var(--accent); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; margin: 10px 0; }
.form h3 { font-size: 16px; font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.grid .full { grid-column: 1 / -1; }
@media (max-width: 520px) { .grid { grid-template-columns: minmax(0, 1fr); } }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); min-width: 0; }
label.f input, label.f select, label.f textarea { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
label.f textarea { min-height: 70px; resize: vertical; }
.computed { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.link-edit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: 6px; }
@media (max-width: 520px) { .link-edit { grid-template-columns: minmax(0, 1fr) auto; } .link-edit input:nth-child(2) { grid-column: 1 / 2; grid-row: 2; } }
.link-edit input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; font-size: 14px; }
.form-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <div class="top">
    <span class="brand">Carnet de route</span>
    <select id="tripSelect" class="trip-select" aria-label="Choisir un voyage"></select>
    <button class="btn" id="newTrip" type="button">+ Nouveau voyage</button>
  </div>
  <main id="app"><p class="note">Chargement de vos voyages…</p></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const MODES = { bus: "Bus", train: "Train", avion: "Avion", voiture: "Voiture", bateau: "Bateau", autre: "Autre" };
  const state = { trips: {}, currentId: null, editingId: null, insertAt: null, confirm: null, canWrite: true, local: false, loaded: false };
  let db = null;
  const dirty = new Set();
  const timers = {};
  const writing = {};

  const $ = (s) => document.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 10);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function safeUrl(u) {
    u = String(u || "").trim();
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; }
  }
  function source(u) {
    try {
      const h = new URL(u).hostname.replace(/^www\./, "");
      if (h.includes("airbnb")) return "Airbnb";
      if (h.includes("booking")) return "Booking";
      if (h.includes("hotels.com")) return "Hotels.com";
      if (h.includes("expedia")) return "Expedia";
      if (h.includes("hostelworld")) return "Hostelworld";
      if (h.includes("vrbo") || h.includes("abritel")) return "Abritel";
      if (h.includes("google")) return "Google";
      return h.split(".").slice(-2, -1)[0] || h;
    } catch { return "Lien"; }
  }

  // Dates
  const D = (s) => (s ? new Date(s.length <= 10 ? s + "T12:00:00" : s) : null);
  const fmtDay = (s) => { const d = D(s); return d && !isNaN(d) ? d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) : ""; };
  const fmtTime = (s) => { const d = D(s); return d && !isNaN(d) && s.length > 10 ? d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : ""; };
  function nights(a, b) { const x = D(a), y = D(b); if (!x || !y) return null; const n = Math.round((y - x) / 86400000); return n >= 0 ? n : null; }
  function duration(a, b) {
    const x = D(a), y = D(b); if (!x || !y || a.length <= 10 || b.length <= 10) return "";
    let m = Math.round((y - x) / 60000); if (m <= 0) return "";
    const h = Math.floor(m / 60); m = m % 60;
    return h ? `${h} h${m ? " " + String(m).padStart(2, "0") : ""}` : `${m} min`;
  }

  function trip() { return state.trips[state.currentId]; }
  function tripStart(t) {
    const ds = [];
    t.items.forEach((i) => { if (i.type === "stop" && i.arrive) ds.push(i.arrive); if (i.type === "transport" && i.dep) ds.push(i.dep.slice(0, 10)); });
    ds.sort(); return ds[0] || null;
  }
  function tripEnd(t) {
    const ds = [];
    t.items.forEach((i) => { if (i.type === "stop") { if (i.depart) ds.push(i.depart); else if (i.arrive) ds.push(i.arrive); } if (i.type === "transport" && i.arr) ds.push(i.arr.slice(0, 10)); });
    ds.sort(); return ds[ds.length - 1] || null;
  }

  // ---------- Rendu ----------
  function renderSelect() {
    const sel = $("#tripSelect");
    const ids = Object.keys(state.trips).sort((a, b) => (state.trips[a].name || "").localeCompare(state.trips[b].name || ""));
    sel.innerHTML = ids.map((id) => `<option value="${esc(id)}"${id === state.currentId ? " selected" : ""}>${esc(state.trips[id].name || "Sans titre")}</option>`).join("");
    sel.hidden = ids.length === 0;
    $("#newTrip").hidden = !state.canWrite;
  }

  function render() {
    renderSelect();
    const app = $("#app");
    const t = trip();
    if (!state.loaded) return;
    if (!t) {
      app.innerHTML = `<div class="empty"><h2>Aucun voyage pour l'instant</h2><p class="note">Créez un voyage, puis ajoutez vos étapes, vos hébergements et vos trajets.</p>${state.canWrite ? '<button class="btn primary" data-act="new-trip" type="button">Créer un voyage</button>' : ""}</div>`;
      return;
    }
    const stops = t.items.filter((i) => i.type === "stop");
    const legs = t.items.filter((i) => i.type === "transport");
    const totalNights = stops.reduce((s, i) => s + (nights(i.arrive, i.depart) || 0), 0);
    const start = tripStart(t), end = tripEnd(t);
    const w = state.canWrite;

    let html = `<section class="hero">
      <h1>${w ? `<input id="tripName" value="${esc(t.name)}" aria-label="Nom du voyage">` : esc(t.name)}</h1>
      <div class="stats">
        ${start ? `<span><b>${esc(fmtDay(start))}</b> → <b>${esc(fmtDay(end))}</b></span>` : ""}
        <span><b>${stops.length}</b> étape${stops.length > 1 ? "s" : ""}</span>
        <span><b>${totalNights}</b> nuit${totalNights > 1 ? "s" : ""} réservée${totalNights > 1 ? "s" : ""}</span>
        <span><b>${legs.length}</b> trajet${legs.length > 1 ? "s" : ""}</span>
      </div>
      ${state.local ? '<p class="note">Mode local : vos données restent dans ce navigateur.</p>' : ""}
      ${w ? (state.confirm === "trip"
        ? `<div class="confirm">Supprimer « ${esc(t.name)} » et tout son contenu ? <button class="btn small danger" data-act="del-trip-yes" type="button">Supprimer</button><button class="btn small" data-act="cancel-confirm" type="button">Annuler</button></div>`
        : `<div class="hero-actions"><button class="btn ghost small danger" data-act="del-trip" type="button">Supprimer ce voyage</button></div>`) : ""}
    </section><section class="route" aria-label="Itinéraire">`;

    html += insertRow(0);
    t.items.forEach((it, idx) => {
      if (state.editingId === it.id) html += it.type === "stop" ? stopForm(it) : transportForm(it);
      else html += it.type === "stop" ? stopCard(it, t, idx) : transportCard(it, idx);
      html += insertRow(idx + 1);
    });
    if (!t.items.length) html += `<p class="note">Commencez par ajouter votre première étape.</p>`;
    html += `</section>`;
    app.innerHTML = html;
  }

  function insertRow(pos) {
    if (!state.canWrite) return "";
    if (state.insertAt && state.insertAt.pos === pos) {
      const draft = state.insertAt.draft;
      return draft.type === "stop" ? stopForm(draft, true) : transportForm(draft, true);
    }
    return `<div class="insert"><button class="btn" data-act="add-stop" data-pos="${pos}" type="button">+ Étape</button><button class="btn" data-act="add-leg" data-pos="${pos}" type="button">+ Trajet</button></div>`;
  }

  function actions(it, idx) {
    if (!state.canWrite) return "";
    if (state.confirm === it.id) return `<div class="row-actions confirm">Supprimer ? <button class="btn small danger" data-act="del-yes" data-id="${it.id}" type="button">Oui</button><button class="btn small" data-act="cancel-confirm" type="button">Non</button></div>`;
    const n = trip().items.length;
    return `<div class="row-actions">
      ${idx > 0 ? `<button class="btn ghost small" data-act="up" data-id="${it.id}" type="button" aria-label="Monter">↑</button>` : ""}
      ${idx < n - 1 ? `<button class="btn ghost small" data-act="down" data-id="${it.id}" type="button" aria-label="Descendre">↓</button>` : ""}
      <button class="btn ghost small" data-act="edit" data-id="${it.id}" type="button">Modifier</button>
      <button class="btn ghost small" data-act="del" data-id="${it.id}" type="button">Supprimer</button></div>`;
  }

  function stopCard(it, t, idx) {
    const start = tripStart(t);
    const dayN = it.arrive && start ? nights(start, it.arrive) + 1 : null;
    const n = nights(it.arrive, it.depart);
    const links = (it.links || []).filter((l) => safeUrl(l.url));
    const maps = it.address || it.place ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.address || it.place)}` : "";
    return `<article class="item stop">
      <div class="stop-head">
        ${dayN ? `<span class="day">JOUR ${dayN}</span>` : ""}
        <h2>${esc(it.place || "Étape sans nom")}</h2>
      </div>
      <div class="dates">${it.arrive ? esc(fmtDay(it.arrive)) : "date à définir"}${it.depart ? " → " + esc(fmtDay(it.depart)) : ""} ${n !== null && n > 0 ? `<span class="nights">${n} nuit${n > 1 ? "s" : ""}</span>` : ""}</div>
      ${it.address ? `<div class="addr">${esc(it.address)}</div>` : ""}
      ${links.length ? `<div class="links">${links.map((l) => { const u = safeUrl(l.url); return `<a class="link" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><span class="src">${esc(source(u))}</span><span class="lbl">${esc(l.label || u)}</span><span class="go">↗</span></a>`; }).join("")}</div>` : ""}
      ${it.notes ? `<div class="notes">${esc(it.notes)}</div>` : ""}
      <div class="leg-extra">${maps ? `<a href="${esc(maps)}" target="_blank" rel="noopener noreferrer">Voir sur la carte ↗</a>` : ""}</div>
      ${actions(it, idx)}
    </article>`;
  }

  function transportCard(it, idx) {
    const d = duration(it.dep, it.arr);
    const u = safeUrl(it.url);
    return `<article class="item transport">
      <span class="mode">${esc(MODES[it.mode] || "Trajet")}</span>
      <div class="leg">
        <div class="leg-places">${esc(it.from || "Départ ?")} → ${esc(it.to || "Arrivée ?")}</div>
        <div class="leg-times">
          <span>Départ <b>${it.dep ? esc(fmtDay(it.dep)) + (fmtTime(it.dep) ? " " + esc(fmtTime(it.dep)) : "") : "à définir"}</b></span>
          <span>Arrivée <b>${it.arr ? esc(fmtDay(it.arr)) + (fmtTime(it.arr) ? " " + esc(fmtTime(it.arr)) : "") : "à définir"}</b></span>
          ${d ? `<span class="dur">${esc(d)}</span>` : ""}
        </div>
        ${(it.company || it.ref || u || it.notes) ? `<div class="leg-extra">
          ${it.company ? `<span>${esc(it.company)}</span>` : ""}
          ${it.ref ? `<span>Réf. ${esc(it.ref)}</span>` : ""}
          ${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Réservation ↗</a>` : ""}
          ${it.notes ? `<span>${esc(it.notes)}</span>` : ""}
        </div>` : ""}
      </div>
      ${actions(it, idx)}
    </article>`;
  }

  function stopForm(it, isNew) {
    const links = it.links && it.links.length ? it.links : [{ id: uid(), label: "", url: "" }];
    return `<form class="form" data-form="stop" data-id="${it.id}" data-new="${isNew ? 1 : 0}">
      <h3>${isNew ? "Nouvelle étape" : "Modifier l'étape"}</h3>
      <div class="grid">
        <label class="f full">Lieu<input name="place" id="f-place-${it.id}" value="${esc(it.place)}" placeholder="Ex. Rio de Janeiro" required></label>
        <label class="f">Arrivée<input type="date" name="arrive" id="f-arr-${it.id}" value="${esc(it.arrive)}"></label>
        <label class="f">Départ<input type="date" name="depart" id="f-dep-${it.id}" value="${esc(it.depart)}"></label>
        <label class="f full">Adresse de l'hébergement<input name="address" id="f-addr-${it.id}" value="${esc(it.address)}" placeholder="Optionnel"></label>
      </div>
      <div class="computed" data-nights></div>
      <div class="f" style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)">Liens de réservation (hôtel, Airbnb…)</span>
        <div data-links style="display:flex;flex-direction:column;gap:6px">
          ${links.map((l) => linkRow(l)).join("")}
        </div>
        <div><button class="btn small" data-act="add-link" type="button">+ Ajouter un lien</button></div>
      </div>
      <label class="f">Notes<textarea name="notes" id="f-notes-${it.id}" placeholder="Code d'accès, heure de check-in, idées de visites…">${esc(it.notes)}</textarea></label>
      <div class="form-actions"><button class="btn" data-act="cancel" type="button">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div>
    </form>`;
  }
  function linkRow(l) {
    return `<div class="link-edit" data-link="${l.id}">
      <input name="lbl" id="l-lbl-${l.id}" value="${esc(l.label)}" placeholder="Nom (ex. Pousada Azul)" aria-label="Nom du lien">
      <input name="url" id="l-url-${l.id}" value="${esc(l.url)}" placeholder="https://www.airbnb.fr/rooms/…" aria-label="Adresse du lien" inputmode="url">
      <button class="btn ghost small" data-act="rm-link" type="button" aria-label="Retirer ce lien">✕</button>
    </div>`;
  }

  function transportForm(it, isNew) {
    return `<form class="form" data-form="transport" data-id="${it.id}" data-new="${isNew ? 1 : 0}">
      <h3>${isNew ? "Nouveau trajet" : "Modifier le trajet"}</h3>
      <div class="grid">
        <label class="f">Moyen de transport<select name="mode" id="t-mode-${it.id}">${Object.entries(MODES).map(([k, v]) => `<option value="${k}"${it.mode === k ? " selected" : ""}>${v}</option>`).join("")}</select></label>
        <label class="f">Compagnie<input name="company" id="t-comp-${it.id}" value="${esc(it.company)}" placeholder="Ex. 1001, LATAM"></label>
        <label class="f">Lieu de départ<input name="from" id="t-from-${it.id}" value="${esc(it.from)}" placeholder="Ex. Terminal Tietê"></label>
        <label class="f">Lieu d'arrivée<input name="to" id="t-to-${it.id}" value="${esc(it.to)}" placeholder="Ex. Rodoviária Novo Rio"></label>
        <label class="f">Départ (date et heure)<input type="datetime-local" name="dep" id="t-dep-${it.id}" value="${esc(it.dep)}"></label>
        <label class="f">Arrivée (date et heure)<input type="datetime-local" name="arr" id="t-arr-${it.id}" value="${esc(it.arr)}"></label>
        <div class="computed full" data-duration></div>
        <label class="f">N° de réservation<input name="ref" id="t-ref-${it.id}" value="${esc(it.ref)}"></label>
        <label class="f">Lien de réservation<input name="url" id="t-url-${it.id}" value="${esc(it.url)}" placeholder="https://…" inputmode="url"></label>
        <label class="f full">Notes<input name="notes" id="t-notes-${it.id}" value="${esc(it.notes)}" placeholder="Quai, siège, bagages…"></label>
      </div>
      <div class="form-actions"><button class="btn" data-act="cancel" type="button">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div>
    </form>`;
  }

  function refreshComputed() {
    document.querySelectorAll("form[data-form]").forEach((f) => {
      if (f.dataset.form === "stop") {
        const n = nights(f.arrive.value, f.depart.value);
        f.querySelector("[data-nights]").textContent = n !== null && f.arrive.value && f.depart.value ? `${n} nuit${n > 1 ? "s" : ""}` : (f.arrive.value && f.depart.value ? "Le départ est avant l'arrivée." : "");
      } else {
        const d = duration(f.dep.value, f.arr.value);
        f.querySelector("[data-duration]").textContent = d ? `Durée : ${d}` : (f.dep.value && f.arr.value ? "L'arrivée doit être après le départ." : "La durée se calcule à partir des horaires.");
      }
    });
  }

  // ---------- Données ----------
  function neighbours(pos) {
    const items = trip().items;
    let prev = null, next = null;
    for (let i = pos - 1; i >= 0; i--) if (items[i].type === "stop") { prev = items[i]; break; }
    for (let i = pos; i < items.length; i++) if (items[i].type === "stop") { next = items[i]; break; }
    return { prev, next };
  }

  function readForm(f) {
    const o = { id: f.dataset.id, type: f.dataset.form };
    if (o.type === "stop") {
      ["place", "arrive", "depart", "address", "notes"].forEach((k) => (o[k] = f[k].value.trim()));
      o.links = [...f.querySelectorAll("[data-link]")].map((r) => ({ id: r.dataset.link, label: r.querySelector('[name="lbl"]').value.trim(), url: r.querySelector('[name="url"]').value.trim() })).filter((l) => l.url);
    } else {
      ["mode", "from", "to", "dep", "arr", "company", "ref", "url", "notes"].forEach((k) => (o[k] = f[k].value.trim()));
    }
    return o;
  }

  function commit(id) {
    const t = state.trips[id]; if (!t) return;
    t.updatedAt = Date.now();
    dirty.add(id);
    clearTimeout(timers[id]);
    timers[id] = setTimeout(() => flush(id), 500);
  }
  async function flush(id) {
    if (state.local) { saveLocal(); dirty.delete(id); return; }
    if (writing[id]) { timers[id] = setTimeout(() => flush(id), 300); return; }
    writing[id] = true;
    const t = state.trips[id];
    try {
      if (t) await db.doc("trips/" + id).set(JSON.parse(JSON.stringify(t)));
      else await db.doc("trips/" + id).delete();
    } catch (e) {
      if (e && e.code === "invalid_argument") { state.canWrite = false; toast("Vous ne pouvez pas modifier ce carnet."); render(); }
      else if (e && e.code === "quota_exceeded") toast("Espace de stockage plein : supprimez un ancien voyage.");
      else toast("Enregistrement impossible pour le moment, réessayez.");
    } finally { writing[id] = false; dirty.delete(id); }
  }
  function saveLocal() { try { localStorage.setItem("carnet-route-trips", JSON.stringify(state.trips)); } catch {} }
  function loadLocal() { try { return JSON.parse(localStorage.getItem("carnet-route-trips") || "{}"); } catch { return {}; } }

  let toastT;
  function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 2600); }

  function createTrip() {
    const id = "v-" + uid();
    state.trips[id] = { name: "Nouveau voyage", items: [], createdAt: Date.now() };
    state.currentId = id; rememberCurrent();
    commit(id); render();
    const n = $("#tripName"); if (n) { n.focus(); n.select(); }
  }
  function rememberCurrent() { try { localStorage.setItem("carnet-route-current", state.currentId || ""); } catch {} }

  // ---------- Événements ----------
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, t = trip();
    if (act === "new-trip") return createTrip();
    if (!t) return;
    const idx = b.dataset.id ? t.items.findIndex((i) => i.id === b.dataset.id) : -1;
    switch (act) {
      case "add-stop": {
        const pos = +b.dataset.pos; const { prev } = neighbours(pos);
        const prevLeg = t.items[pos - 1] && t.items[pos - 1].type === "transport" ? t.items[pos - 1] : null;
        const arrive = prevLeg && prevLeg.arr ? prevLeg.arr.slice(0, 10) : (prev && prev.depart) || "";
        state.insertAt = { pos, draft: { id: uid(), type: "stop", place: prevLeg ? prevLeg.to : "", arrive, depart: "", address: "", notes: "", links: [] } };
        state.editingId = null; break;
      }
      case "add-leg": {
        const pos = +b.dataset.pos; const { prev, next } = neighbours(pos);
        const dep = prev && prev.depart ? prev.depart + "T08:00" : "";
        state.insertAt = { pos, draft: { id: uid(), type: "transport", mode: "bus", from: prev ? prev.place : "", to: next ? next.place : "", dep, arr: "", company: "", ref: "", url: "", notes: "" } };
        state.editingId = null; break;
      }
      case "edit": state.editingId = b.dataset.id; state.insertAt = null; state.confirm = null; break;
      case "cancel": state.editingId = null; state.insertAt = null; break;
      case "up": case "down": {
        const j = act === "up" ? idx - 1 : idx + 1;
        [t.items[idx], t.items[j]] = [t.items[j], t.items[idx]];
        commit(state.currentId); break;
      }
      case "del": state.confirm = b.dataset.id; break;
      case "del-yes": t.items.splice(idx, 1); state.confirm = null; commit(state.currentId); toast("Supprimé"); break;
      case "del-trip": state.confirm = "trip"; break;
      case "del-trip-yes": {
        const id = state.currentId; delete state.trips[id]; state.confirm = null;
        state.currentId = Object.keys(state.trips)[0] || null; rememberCurrent();
        commit(id); toast("Voyage supprimé"); break;
      }
      case "cancel-confirm": state.confirm = null; break;
      case "add-link": {
        const box = b.closest("form").querySelector("[data-links]");
        box.insertAdjacentHTML("beforeend", linkRow({ id: uid(), label: "", url: "" }));
        box.lastElementChild.querySelector('[name="url"]').focus();
        return;
      }
      case "rm-link": b.closest("[data-link]").remove(); return;
      default: return;
    }
    render(); refreshComputed();
  });

  document.addEventListener("submit", (e) => {
    const f = e.target.closest("form[data-form]"); if (!f) return;
    e.preventDefault();
    const t = trip(), o = readForm(f);
    if (f.dataset.new === "1") { t.items.splice(state.insertAt.pos, 0, o); state.insertAt = null; }
    else { const i = t.items.findIndex((x) => x.id === o.id); if (i >= 0) t.items[i] = o; state.editingId = null; }
    commit(state.currentId); render(); toast("Enregistré");
  });

  document.addEventListener("input", (e) => {
    if (e.target.id === "tripName") { const t = trip(); t.name = e.target.value; commit(state.currentId); renderSelect(); return; }
    if (e.target.closest("form[data-form]")) refreshComputed();
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "tripSelect") { state.currentId = e.target.value; state.editingId = null; state.insertAt = null; state.confirm = null; rememberCurrent(); render(); }
  });
  $("#newTrip").addEventListener("click", createTrip);

  // ---------- Démarrage ----------
  function pickCurrent() {
    if (state.currentId && state.trips[state.currentId]) return;
    let saved = null; try { saved = localStorage.getItem("carnet-route-current"); } catch {}
    state.currentId = saved && state.trips[saved] ? saved : Object.keys(state.trips)[0] || null;
  }
  function startLocal() {
    state.local = true; state.trips = loadLocal(); state.loaded = true; pickCurrent(); render();
  }

  (async () => {
    if (!window.claude || !window.claude.use) return startLocal();
    db = await window.claude.use("db");
    if (!db) return startLocal();
    const user = await window.claude.use("user");
    if (user && user.can) { try { const c = await user.can("data.write"); if (c === false) state.canWrite = false; } catch {} }
    db.collection("trips").onSnapshot((snap) => {
      const editingOpen = !!(state.editingId || state.insertAt || (document.activeElement && document.activeElement.id === "tripName"));
      snap.docs.forEach((d) => { if (!dirty.has(d.id) && !(editingOpen && d.id === state.currentId && state.loaded)) state.trips[d.id] = JSON.parse(JSON.stringify(d.data())); });
      snap.docChanges().forEach((c) => { if (c.type === "removed" && !dirty.has(c.doc.id)) delete state.trips[c.doc.id]; });
      state.loaded = true; pickCurrent();
      if (!editingOpen) render(); else renderSelect();
    }, () => { toast("Synchronisation interrompue. Rechargez la page."); });
  })();
})();
</script>
