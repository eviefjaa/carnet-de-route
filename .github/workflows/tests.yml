# Tests à chaque envoi de code : unitaires, rappels et règles de sécurité Firestore (émulateur)
# Le parcours complet dans Chrome se lance à la main : npm run test:e2e (voir README).

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: Rappels
        working-directory: scripts/reminders
        run: node test.js
      - name: Dépendances des tests
        working-directory: tests
        run: npm ci --no-audit --no-fund
      - name: Tests unitaires et règles Firestore
        working-directory: tests
        run: npm test
